# ==========================================
# CONFIGURACAO BASE
# ==========================================
# Define o perfil ativo
# No servidor de produção, a variável de ambiente SPRING_PROFILES_ACTIVE sobrescreve isso
spring.profiles.active=dev

# Desativa o Open Session in View (OSIV) para evitar desperdício de conexões
spring.jpa.open-in-view=false

# Previne problema N+1 carregando proxies em lote
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# Não expor stacktraces ou detalhes internos no endpoint de erro padrão
server.error.include-stacktrace=never
server.error.include-message=never
