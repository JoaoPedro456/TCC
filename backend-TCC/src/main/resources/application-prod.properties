# ==================== Production Profile ====================

# Banco de dados PostgreSQL (configurado via variaveis de ambiente no Render)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 desabilitado em producao
spring.h2.console.enabled=false

# JWT (configurado via variaveis de ambiente no Render)
jwt.secret=${JWT_SECRET:bazani-mecanica-tcc-2026-secret-key-min-256-bits-required}
jwt.expiration=${JWT_EXPIRATION:28800000}

# Logging
logging.level.org.springframework=WARN
logging.level.com.tcc.backend_TCC=INFO