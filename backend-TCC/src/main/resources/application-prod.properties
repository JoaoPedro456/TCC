# ==================== Production Profile ====================
# IMPORTANTE: Configure estas propriedades via variáveis de ambiente

# Banco de dados PostgreSQL (obrigatório em produção)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/TCC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Desabilitar console H2 em produção
spring.h2.console.enabled=false

# JWT secret deve ser configurado via variável de ambiente JWT_SECRET
jwt.secret=${JWT_SECRET}
jwt.expiration=28800000

# Logging mínimo em produção
logging.level.org.springframework=WARN
logging.level.com.tcc.backend_TCC=INFO
