# ==================== Development Profile ====================
# Habilita console H2 para desenvolvimento
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Banco de dados H2 (em memória) para dev
spring.datasource.url=jdbc:h2:mem:tcc-dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging detalhado em dev
logging.level.org.springframework=INFO
logging.level.com.tcc.backend_TCC=DEBUG
