name: Supabase Database Backup

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Configurar Carimbo de Data/Hora (Timestamp)
        id: timestamp
        run: echo "TIMESTAMP=$(date +'%Y-%m-%d_%H-%M-%S')" >> $GITHUB_ENV

      - name: Fazer o Backup do Supabase (Usando Docker)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "Erro: A Secret SUPABASE_DB_URL não foi configurada no repositório."
            exit 1
          fi
          
          echo "Iniciando o backup do banco de dados com a imagem oficial do PostgreSQL 17..."
          
          docker run --rm postgres:17 pg_dump "$SUPABASE_DB_URL" --clean --if-exists --no-owner --no-privileges > backup_tcc_${{ env.TIMESTAMP }}.sql
          
          echo "Backup concluído com sucesso."

      - name: Salvar o Arquivo de Backup no GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: database-backup-tcc-${{ env.TIMESTAMP }}
          path: backup_tcc_${{ env.TIMESTAMP }}.sql
          retention-days: 90
